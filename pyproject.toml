[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lemonmatrix"
version = "0.1.0"
description = "A benchmarking control plane for Lemonade instances."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "click>=8.0",
    "requests>=2.28",
    "jsonschema>=4.18",
    "flask>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
lemonmatrix = "lemonmatrix.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lemonmatrix = ["templates/*.html", "schema/*.json", "static/*"]
