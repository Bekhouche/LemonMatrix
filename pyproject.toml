[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lemonmatrix"
version = "0.1.1"
description = "Benchmark Lemonade local AI servers and publish comparable, validated results."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Salah Eddine Bekhouche", email = "bekhouchesalah@gmail.com" }]
keywords = ["lemonade", "benchmark", "llm", "local-ai", "amd", "ryzen-ai", "radeon", "llama.cpp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Benchmark",
]
dependencies = [
    "click>=8.0",
    "requests>=2.28",
    "jsonschema>=4.18",
    "flask>=3.0",
]

[project.urls]
Homepage = "https://lemonmatrix.github.io"
Guide = "https://lemonmatrix.github.io/guide.html"
Source = "https://github.com/Bekhouche/LemonMatrix"
Issues = "https://github.com/Bekhouche/LemonMatrix/issues"

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
lemonmatrix = "lemonmatrix.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lemonmatrix = ["templates/*.html", "schema/*.json", "static/*"]
